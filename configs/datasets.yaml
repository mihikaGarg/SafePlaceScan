# Unified classes. Order = class IDs in the merged dataset.
classes: [pothole, trash, graffiti, tent]

# Each source is a Roboflow Universe dataset, downloaded in YOLOv8 format.
# class_map: source class name -> unified class. Unlisted classes are dropped.
# "*" sends every class in that source to one unified class.
# max_images: cap per source so one dataset doesn't dominate.

sources:
  # TACO: litter in the wild, ~60 trash sub-categories, polygon labels
  - name: trash
    roboflow: {workspace: "narwhal", project: "taco-trash-annotations-in-context-vpdro", version: 4}
    class_map: {"*": trash}
    max_images: 1500

  - name: road_damage
    roboflow: {workspace: "itech-area", project: "pothole-ndjrq", version: 1}
    class_map: {"*": pothole}
    max_images: 1500

  # Also labels "Efflorescence" (wall stains), which gets dropped
  - name: graffiti
    roboflow: {workspace: "valentijn", project: "graffiti-nmltp", version: 1}
    class_map: {Graffiti: graffiti, graffiti: graffiti}
    max_images: 1500

  - name: tents
    roboflow: {workspace: "traininggaebo", project: "tent-model", version: 1}
    class_map: {"*": tent}

  # - name: tents_homeless
  #   roboflow: {workspace: "homeless", project: "CHANGE_ME", version: 1}
  #   class_map: {"*": tent}
